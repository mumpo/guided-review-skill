name: Release plugin

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: git diff --exit-code
      - run: bun run package:plugin
      - name: Read release version
        run: bun -e 'console.log("PLUGIN_VERSION=" + (await Bun.file("plugin.json").json()).version)' >> "$GITHUB_ENV"
      - run: bun run test:plugin "dist/plugin/guided-review-${PLUGIN_VERSION}.zip"
      - name: Publish complete runtime to the plugins branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/plugin-v${PLUGIN_VERSION}"; then
            echo "Version ${PLUGIN_VERSION} already published; increment both plugin manifests."
            exit 1
          fi
          git init --initial-branch=plugins dist/plugin/marketplace
          cd dist/plugin/marketplace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Reuse the source checkout's authenticated GitHub transport.
          gh auth setup-git
          if git ls-remote --exit-code --heads origin plugins; then
            git fetch --depth=1 origin plugins
            git reset --soft FETCH_HEAD
          fi
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Release guided-review ${PLUGIN_VERSION} from ${GITHUB_SHA}"
          fi
          git push origin HEAD:plugins
      - name: Publish release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "plugin-v${PLUGIN_VERSION}" \
            "dist/plugin/guided-review-${PLUGIN_VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "Guided Review ${PLUGIN_VERSION}" \
            --notes "Complete Claude Code and Codex plugin runtime. Requires Bun 1.3.14+ and gh; no setup command or dependency installation. See README.md for marketplace installation."
